version: '3.9'

services:
  # ─── Backend API ───
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbivex-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      # AI — NVIDIA API (primary LLM for all agents)
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL_STANDARD: ${NVIDIA_MODEL_STANDARD:-meta/llama-3.1-8b-instruct}
      NVIDIA_MODEL_ADVANCED: ${NVIDIA_MODEL_ADVANCED:-meta/llama-3.3-70b-instruct}
      # Embeddings (RAG tutor) still use Ollama — reach it by service name
      OLLAMA_URL: http://ollama:11434
      # Optional
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - orbivex-net

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: orbivex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - orbivex-net

volumes:
  redis_data:

networks:
  orbivex-net:
    driver: bridge
